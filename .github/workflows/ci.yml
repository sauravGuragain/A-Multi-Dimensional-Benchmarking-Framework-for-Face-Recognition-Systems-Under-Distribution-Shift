name: ci

# Lightweight CI: classical + analysis code and the full test suite WITHOUT PyTorch/FaceNet/InsightFace weights.
# Real FaceNet/ArcFace/InsightFace/dlib execution and the real LFW data are NOT exercised here (see the
# `deep-install` job, which only checks that the deep extra installs and imports, and docs/EXPERIMENT_EVIDENCE_RECORD.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deep_install:
        description: "Also run the (heavy) deep-extra install/import check"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (core + dev, no deep extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Static checks (syntax, undefined names, invalid comparisons)
        run: ruff check --select E9,F63,F7,F82 faceeval tests tools api
      - name: Analysis CLIs start
        run: |
          python -m faceeval.analysis.fold0_results --help
          python -m faceeval.analysis.valid_pairs --help
          python -m faceeval.analysis.efficiency --help
          python -m faceeval.analysis.multi_split --help
          python -m faceeval.analysis.figures --help
          python -m faceeval.analysis.env_pins --help
          python -m faceeval.analysis.fairness --help
          python -m faceeval.analysis.evidence_index --help
      - name: Test suite
        run: python -m pytest -q -p no:cacheprovider

  deep-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_install }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deep extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[deep,dev]"
          python -m pip check
      - name: Import real backbones (no weights are downloaded or run)
        run: python -c "import torch, torchvision, facenet_pytorch, insightface, onnxruntime; print(torch.__version__)"
