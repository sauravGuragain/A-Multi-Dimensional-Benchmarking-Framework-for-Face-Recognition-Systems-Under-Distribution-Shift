[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceeval-x"
version = "0.1.0"
description = "Multi-dimensional benchmarking framework for face recognition under distribution shift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Upper bounds found by a clean-environment install on 2026-11-19: an unpinned install resolves opencv-python 5.x,
    # which has no cv2.CascadeClassifier (faceeval/preprocessing/detector.py uses it), and numpy 2.x, which the
    # `deep` extra (facenet-pytorch 2.6.0 pins numpy<2) cannot use. The Fold-0 results were produced with numpy 1.26.4.
    "numpy>=1.24,<2",
    "opencv-python>=4.8,<5",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "mlflow>=2.8",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Install paths (see README "Installation"):
#   pip install -e ".[dev]"         lightweight: classical models, all analysis tools, full test suite; NO PyTorch
#   pip install -e ".[deep,dev]"    adds FaceNet (PyTorch) and ArcFace/InsightFace (ONNX Runtime)
#   pip install -e ".[deep,dlib,dev]"  also the dlib recogniser (needs CMake and a C++ compiler to build dlib)
# Without the deep packages the deep wrappers fall back to stubs unless the experiment config sets
# require_real_models: true (which then stops the run). All `import torch` statements in faceeval are lazy.
# facenet-pytorch 2.6.0 pins torch>=2.2,<2.3 and numpy<2, hence the bounds below (Python 3.11 or 3.12 only).
deep = [
    "torch>=2.2,<2.3",
    "torchvision>=0.17,<0.18",
    "facenet-pytorch>=2.6.0",
    "insightface",
    "onnxruntime",
]
dlib = [
    "dlib",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["faceeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"